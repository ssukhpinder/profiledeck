name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        run: pnpm check

      - name: Upload plugin bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiledeck-plugin-${{ github.sha }}
          path: |
            plugins/profiledeck/
            LICENSE
            THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload HTTP bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiledeck-http-${{ github.sha }}
          path: |
            dist/profiledeck-http.mjs
            LICENSE
            THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
          retention-days: 7
